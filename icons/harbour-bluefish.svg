  <path d="M164 102 Q150 128 164 154" fill="none" stroke="#7fc4f5" stroke-width="6" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="182" cy="118" r="9" fill="#0b5cc2"/>
  <circle cx="185" cy="115" r="3" fill="#ffffff"/>
  <!-- bubbles -->
  <circle cx="214" cy="80" r="7" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
  <circle cx="198" cy="56" r="4.5" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
</svg>
